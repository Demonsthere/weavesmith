<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeaveSmith</title>
    <meta name="description" content="A pattern designer for tablet weaving." />
    <!--
      Relative hrefs, like `base` in vite.config.ts: the app is served from a
      subpath on GitHub Pages, and a leading slash would point at the domain
      root where nothing lives.
    -->
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!-- Matches the manifest, so the browser chrome is the app's own ground
         rather than a white flash before the first paint. -->
    <meta name="theme-color" content="#14110E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
