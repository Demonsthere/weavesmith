name: Test

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      # CI drives the Makefile now, so a change to it changes what CI runs.
      - "Makefile"
      - ".github/workflows/test.yml"
  # Commits land on main directly today, so main would otherwise never be
  # tested by CI. Same filters.
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      # CI drives the Makefile now, so a change to it changes what CI runs.
      - "Makefile"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      # Every step below goes through the Makefile, so CI runs the same
      # commands a contributor runs locally — one definition of "install",
      # "build", "typecheck" and "test", not two that can drift apart.
      #
      # `make install` is `pnpm install` with no flags, which is what you want
      # locally. pnpm reads $CI and defaults `frozen-lockfile` to true when it
      # is set, so on the runner this is the frozen install CI needs without
      # the Makefile having to carry a CI-only flag.
      - name: Install
        run: make install

      # Build first, and not only to catch a package that compiles under vitest
      # but fails to emit declarations. @weavesmith/core's types resolve to its
      # dist, which is gitignored — so on a fresh checkout, typechecking the web
      # app before core is built fails on an import that is perfectly valid.
      # pnpm -r orders by workspace dependency, so core builds first.
      - name: Build
        run: make build

      # `make lint` is the typecheck target: tsc under `strict` plus
      # `noUncheckedIndexedAccess` is the whole static-analysis story today.
      - name: Typecheck
        run: make lint

      - name: Test
        run: make test
